<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <p class="eyebrow">GAME-401</p>
        <h1>Hi, I'm Margaret.</h1>
        <p>I design and build games. Explore my portfolio below!</p>
      </div>
    </header>

    <main class="container">
      <div class="section-heading">
        <h2>Selected games</h2>
        <p>Some prototypes I've worked on.</p>
      </div>
      <section class="games" aria-label="Game portfolio">
        <article class="card">
          <div class="card-content">
            <h3>Trench Survivors</h3>
            <p>
              A side scroller based off of Space Invaders. but with trench
              warfare. (image placeholder for now)
            </p>
            <img
              class="screenshot"
              src="thumb.png"
              alt="Screenshot of my PICO-8 game"
            />
            <div class="game-frame">
              <iframe
                src="https://www.lexaloffle.com/bbs/widget.php?pid=trench_sr"
                allowfullscreen
                width="621"
                height="513"
                style="border: none; overflow: hidden"
              ></iframe>
            </div>
          </div>
        </article>
      </section>

      <footer>
        <p>
          Made with <a href="https://pico-8.com/">Pico-8</a>, HTML, and CSS.
        </p>
      </footer>
    </main>
  </body>
</html>
